<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Telegram...</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #334155;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background-color: #0284c7;
      color: #ffffff;
      text-decoration: none;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }
    .btn:hover {
      background-color: #0369a1;
    }
    .btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="spinner"></div>
    <h2>Redirecting to Telegram</h2>
    <p>Opening the channel automatically. If nothing happens, tap the button below.</p>
    <a href="https://t.me/+0hl3RSFbVqs2MzVl" class="btn" id="joinBtn">Open Channel</a>
  </div>

  <script>
    (function () {
      const inviteHash = "+0hl3RSFbVqs2MzVl";
      const cleanHash = inviteHash.replace("+", "");
      const webUrl = "https://t.me/" + inviteHash;
      
      const userAgent = navigator.userAgent || navigator.vendor || window.opera;
      const isAndroid = /android/i.test(userAgent);
      const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;

      function attemptRedirect() {
        if (isAndroid) {
          // Native Android intent trigger
          window.location.href = "intent://t.me/" + inviteHash + "#Intent;package=org.telegram.messenger;scheme=https;end;";
        } else if (isIOS) {
          // iOS deep link scheme
          window.location.href = "tg://join?invite=" + cleanHash;
          setTimeout(function () {
            window.location.href = webUrl;
          }, 1200);
        } else {
          // Fallback / Desktop
          window.location.href = webUrl;
        }
      }

      // Trigger automatic redirect attempt on page load
      window.addEventListener("DOMContentLoaded", function () {
        setTimeout(attemptRedirect, 150);
      });
    })();
  </script>

</body>
</html>
